<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ระบบนิเวศ - AI Lab</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #e2e8f0;
            overflow: hidden;
            /* Animated Lab Background */
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #020617 100%);
            background-size: 200% 200%;
            animation: moveBackground 15s ease infinite;
        }
        
        @keyframes moveBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.3); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.6); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Exciting Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            70% { transform: scale(1.05) translateY(-5px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes scanLaser {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; box-shadow: 0 0 20px 2px #22d3ee, 0 0 40px 5px #3b82f6; }
            90% { opacity: 1; box-shadow: 0 0 20px 2px #22d3ee, 0 0 40px 5px #3b82f6; }
            100% { top: 100%; opacity: 0; }
        }
        .laser-scanner {
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: #22d3ee;
            z-index: 50;
            animation: scanLaser 1.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(99,102,241,0.2); }
            50% { box-shadow: 0 0 30px rgba(99,102,241,0.6); }
        }
        .slot-active { animation: pulseGlow 2s infinite; border-color: #6366f1; }

        /* Hardware acceleration for smooth scrolling/animations */
        .hardware-accelerated { transform: translateZ(0); will-change: transform, opacity; }
    </style>
</head>
<body class="h-screen flex flex-col lg:flex-row overflow-hidden">

    <!-- ----------------- โซนซ้าย/บน: ห้องทดลองจับคู่ (LAB ZONE) ----------------- -->
    <div class="w-full lg:w-2/3 flex-1 min-h-[55vh] lg:min-h-0 p-4 sm:p-6 flex flex-col items-center justify-center relative border-b lg:border-b-0 lg:border-r border-slate-800/50 shadow-2xl z-10 backdrop-blur-sm bg-slate-900/30">
        
        <!-- ป้ายชื่อมุมซ้ายบน -->

                AI ECOLOGY LAB

        </div>

        <!-- ปุ่มมุมขวาบน -->

            <button onclick="toggleModal(true)" class="flex items-center gap-1 sm:gap-2 bg-slate-800/80 hover:bg-indigo-600 text-white px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm transition-all shadow-[0_0_15px_rgba(0,0,0,0.5)] hover:shadow-[0_0_20px_rgba(99,102,241,0.4)] backdrop-blur-md border border-slate-700/50 hardware-accelerated">

                <span>คู่มือทฤษฎี</span>
            </button>
        </div>

        <!-- กระดานจับคู่หลัก -->

                <div class="laser-scanner"></div>

                <p class="text-cyan-300 font-mono text-sm tracking-widest font-bold animate-pulse shadow-black drop-shadow-md">ANALYZING BIO-SIGNATURES...</p>
            </div>

            <!-- Slots -->

                <!-- Slot 1 -->

                    <span id="slot1-empty" class="text-slate-600 font-medium flex flex-col items-center gap-1 sm:gap-2 transition-opacity">
                        <i data-lucide="dna" class="w-6 h-6 sm:w-8 sm:h-8 opacity-40"></i>
                        <span class="text-[10px] sm:text-sm">สิ่งมีชีวิตที่ 1</span>
                    </span>
                    <div id="slot1-content" class="absolute inset-0 hidden">
                        <div id="slot1-media" class="absolute inset-0 -z-10"></div>
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex items-end justify-center pb-2 sm:pb-3">
                            <span id="slot1-name" class="text-white font-bold text-xs sm:text-lg drop-shadow-lg"></span>
                        </div>
                        <div class="absolute top-2 right-2 bg-black/60 p-1.5 rounded-full text-white opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-500">

                    </div>
                </div>

                <!-- เครื่องหมาย + -->

                        <span class="text-[10px] sm:text-sm">สิ่งมีชีวิตที่ 2</span>

                    <div id="slot2-content" class="absolute inset-0 hidden">
                        <div id="slot2-media" class="absolute inset-0 -z-10"></div>
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex items-end justify-center pb-2 sm:pb-3">

        <!-- แถบค้นหาและตัวกรอง -->
        <div class="p-3 sm:p-4 bg-slate-900/80 border-b border-slate-800/80 z-10 shadow-md hardware-accelerated">
            <div class="relative mb-3 group">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4 group-focus-within:text-cyan-400 transition-colors"></i>
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="ค้นหาสิ่งมีชีวิต (เช่น เสือ, ปลวก)..." 
                    oninput="handleSearch()"

                />
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide snap-x" id="categoryFilters">
                <!-- ปุ่มจะถูกสร้างที่นี่ -->
            </div>
        </div>

                    <!-- เนื้อหา Modal จะถูกสร้างผ่าน JavaScript -->

            if (ids.includes('tree') && ids.includes('strangler_fig')) return { type: 'parasitism', detail: 'ไทรย้อยเริ่มต้นจากการอิงอาศัย แต่เมื่อโตขึ้นจะแย่งแสงและรัดต้นไม้เดิมจนตาย (กาฝาก)' };
            if (ids.includes('caterpillar') && ids.includes('cordyceps')) return { type: 'parasitism', detail: 'ราแมลง (Cordyceps) เข้าสิงและเติบโตในตัวหนอน ดูดกินสารอาหารจนหนอนตาย' };
            if (ids.includes('ant') && ids.includes('aphid')) return { type: 'protocooperation', detail: 'มดคอยปกป้องเพลี้ยอ่อนจากศัตรู ส่วนเพลี้ยอ่อนให้น้ำหวาน (Honeydew) แก่มดเป็นอาหาร' };
            if (ids.includes('termite') && ids.includes('trichonympha')) return { type: 'mutualism', detail: 'โปรโตซัวไตรโคนิมฟาในลำไส้ปลวกช่วยย่อยเซลลูโลสในไม้ ปลวกให้ที่อยู่อาศัยและอาหาร ขาดกันไม่ได้' };

            // Dynamic AI Rule-based Matching (รองรับ 4,950 รูปแบบ)
            const hasTrait = (trait) => t1.includes(trait) || t2.includes(trait);
            const getOpposite = (trait) => t1.includes(trait) ? org2 : org1;

            if (hasTrait('carnivorous_plant') && (c1 === 'insect' || c2 === 'insect')) {
                return { type: 'predation', detail: 'พืชกินแมลงทำการดักจับและย่อยสลายแมลงเพื่อนำแร่ธาตุมาเป็นอาหารเสริม' };
            }
            if (hasTrait('parasite')) {
                if (hasTrait('host') || hasTrait('mammal') || hasTrait('bird') || hasTrait('prey') || hasTrait('marine_host')) {
                    return { type: 'parasitism', detail: `ปรสิตเกาะติดหรือดูดสารอาหารและทำอันตรายต่อโฮสต์ (${getOpposite('parasite').name} เสียสุขภาพและเสียประโยชน์)` };
                }
            }
            if (hasTrait('pollinator') && hasTrait('nectar_provider')) {
                return { type: 'protocooperation', detail: `แมลง/นก ได้น้ำหวานเป็นอาหาร ส่วนพืชได้รับการผสมเกสรเพื่อให้ขยายพันธุ์ได้รวดเร็ว` };
            }
            if (hasTrait('carnivore') && hasTrait('herbivore')) {
                return { type: 'predation', detail: `สัตว์กินเนื้อล่าและกินสัตว์กินพืชเป็นอาหาร (${getOpposite('carnivore').name} ตกเป็นเหยื่อ)` };
            }
            if (hasTrait('predator') && hasTrait('prey')) {
                return { type: 'predation', detail: `ผู้ล่า (${t1.includes('predator') ? org1.name : org2.name}) ทำการล่าเหยื่อเพื่อเป็นอาหารตามระบบห่วงโซ่อาหาร` };
            }
            if (hasTrait('apex') && hasTrait('carnivore') && org1.id !== org2.id) {
                return { type: 'competition', detail: 'สัตว์นักล่าทั้งสองชนิดเกิดการต่อสู้เพื่อแย่งชิงเหยื่อหรืออาณาเขตเดียวกันในระบบนิเวศ' };
            }
            if (hasTrait('herbivore') && hasTrait('prey_plant')) {
                return { type: 'predation', detail: `สัตว์กินพืชกัดกินพืชเป็นอาหาร (ในทางนิเวศวิทยาถือเป็นการล่ารูปแบบหนึ่ง)` };
            }
            if (hasTrait('scavenger') && (hasTrait('apex') || hasTrait('carnivore') || hasTrait('predator'))) {
                return { type: 'commensalism', detail: `สัตว์กินซากรอเก็บกินเศษอาหารที่เหลือจากสัตว์นักล่า โดยสัตว์นักล่าไม่ได้และไม่เสียประโยชน์` };
            }
            if (hasTrait('epiphyte') && hasTrait('tree')) {
                return { type: 'commensalism', detail: `พืชอิงอาศัยเกาะบนพืชยืนต้นเพื่อรับแสง โดยไม่ได้ดูดน้ำเลี้ยงต้นไม้ใหญ่` };
            }
            if (org1.id === org2.id) {
                return { type: 'competition', detail: `สิ่งมีชีวิตชนิดเดียวกัน ย่อมมีการแก่งแย่งทรัพยากร อาหาร หรือคู่ผสมพันธุ์ที่จำกัด (Intraspecific Competition)` };
            }
            if (t1.includes('herbivore') && t2.includes('herbivore')) {
                return { type: 'competition', detail: `สัตว์กินพืชทั้งสองชนิดต้องแก่งแย่งชิงแหล่งอาหาร (พืช) และแหล่งน้ำเดียวกัน` };
            }
            if ((c1 === 'plant' && c2 === 'plant') || (hasTrait('producer') && hasTrait('producer'))) {
                return { type: 'competition', detail: `พืชทั้งสองชนิดต้องแก่งแย่งแสงแดด แร่ธาตุ และน้ำในดินบริเวณเดียวกันเพื่อการเจริญเติบโต` };
            }

            return { type: 'neutralism', detail: `สิ่งมีชีวิตทั้งสองอาจอาศัยในแหล่งเดียวกัน แต่มีความเป็นอยู่แยกกันชัดเจน ไม่มีปฏิสัมพันธ์ที่ส่งผลกระทบต่อกัน` };
        }

        // --- Zero-Lag System & Image Fallbacks ---
        function getProxyImageUrl(url) {
            return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=400&h=400&fit=cover&output=webp`;
        }

        window.handleImgError = async function(img, orgId) {
            if (img.dataset.failed) return;
            img.dataset.failed = "1";
            
            const org = organisms.find(o => o.id === orgId);
            if (!org) return;

            try {
                // หาก Proxy พลาด วิ่งไป Wikipedia อัตโนมัติ (ไม่แล็กเพราะดึงภาพขนาดเล็ก)
                const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${org.wikiPage}`);
                if (!res.ok) throw new Error('Wiki failed');
                const data = await res.json();
                if (data?.thumbnail?.source) {
                    img.src = data.thumbnail.source;
                    img.dataset.failed = "2";
                    return;
                }
            } catch (e) {
                console.warn(`Wiki fetch failed for ${org.name}, generating visual card...`);
            }

            // แผนสุดท้าย: สร้างการ์ดสวยงามทดแทน (เปลี่ยนเฉพาะรูป ไม่ให้ทับ UI อื่นๆ)
            let iconName = 'paw-print';
            let bgColors = "from-slate-800 to-slate-900";
            if (org.category === 'mammal') { iconName = 'paw-print'; bgColors = "from-amber-900/80 to-amber-950"; }
            else if (org.category === 'bird') { iconName = 'bird'; bgColors = "from-sky-900/80 to-sky-950"; }
            else if (org.category === 'insect') { iconName = 'bug'; bgColors = "from-emerald-900/80 to-emerald-950"; }
            else if (org.category === 'marine') { iconName = 'fish'; bgColors = "from-blue-900/80 to-blue-950"; }
            else if (org.category === 'plant') { iconName = 'leaf'; bgColors = "from-green-900/80 to-green-950"; }
            else if (org.category === 'microbe') { iconName = 'microscope'; bgColors = "from-purple-900/80 to-purple-950"; }

            const fallbackDiv = document.createElement('div');
            fallbackDiv.className = `w-full h-full flex flex-col items-center justify-center bg-gradient-to-br ${bgColors} text-slate-300 transition-transform duration-700 group-hover:scale-110`;
            fallbackDiv.innerHTML = `
                <i data-lucide="${iconName}" class="w-8 h-8 mb-2 opacity-50 drop-shadow-md"></i>
                <span class="text-[10px] sm:text-xs font-bold text-center px-2 leading-tight drop-shadow-md pb-3">${org.name}</span>
            `;
            
            img.replaceWith(fallbackDiv);
            lucide.createIcons();
        }

        // สร้าง HTML ทั้งหมดแค่ครั้งเดียวตอนโหลดเว็บ (แก้แล็ก 100%)
        function initInventory() {
            // สร้าง Filter Buttons
            const filterContainer = document.getElementById('categoryFilters');
            filterContainer.innerHTML = categories.map(cat => `
                <button id="btn-cat-${cat.id}" onclick="setCategory('${cat.id}')" class="whitespace-nowrap flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[10px] sm:text-xs font-medium transition-all ${activeCategory === cat.id ? 'bg-cyan-600 text-white shadow-md' : 'bg-slate-800/80 text-slate-400 hover:bg-slate-700 hover:text-white'}">
                    <i data-lucide="${cat.icon}" class="w-3.5 h-3.5"></i> ${cat.name}
                </button>
            `).join('');

            // สร้าง Grid Items 100 ชนิด
            const container = document.getElementById('inventoryGrid');
            container.innerHTML = organisms.map(org => `
                <div id="card-${org.id}" data-category="${org.category}" data-name="${org.name.toLowerCase()}" onclick="selectOrganism('${org.id}')" class="group relative cursor-pointer rounded-xl overflow-hidden aspect-square border-2 border-transparent bg-slate-800 hover:border-cyan-400 transition-all duration-300 shadow-md hover:shadow-[0_0_15px_rgba(34,211,238,0.3)] transform hover:-translate-y-1">
                    <img 
                        src="${getProxyImageUrl(org.images[0])}" 
                        alt="${org.name}" 
                        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" 
                        onerror="handleImgError(this, '${org.id}')"
                        loading="lazy"
                    />
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex items-end p-1.5 sm:p-2 transition-opacity">
                        <div class="w-full">
                            <p class="text-white font-bold text-[10px] sm:text-xs leading-tight drop-shadow-md truncate">${org.name}</p>
                        </div>
                    </div>
                    <div id="check-${org.id}" class="absolute top-1 right-1 sm:top-2 sm:right-2 bg-cyan-500 text-white rounded-full p-0.5 sm:p-1 shadow-lg opacity-0 scale-50 transition-all duration-300">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
            
            // Build Modal
            document.getElementById('modalContent').innerHTML = relationshipTypes.map(type => `
                <div class="p-3 sm:p-4 rounded-xl border ${type.border} ${type.bg} flex flex-col hover:bg-slate-800/80 transition-colors">
                    <div class="flex justify-between items-start mb-1 sm:mb-2">
                        <h3 class="font-bold text-sm sm:text-base ${type.color}">${type.name}</h3>
                        <span class="font-mono font-bold bg-black/40 px-2 py-0.5 rounded text-white text-[10px] sm:text-xs shadow-inner border border-white/5">
                            ${type.symbols}
                        </span>
                    </div>
                    <p class="text-slate-300 text-[10px] sm:text-xs leading-relaxed">
                        ${type.desc}
                    </p>
                </div>
            `).join('');
        }

        // --- Interaction Logic ---
        function filterInventory() {
            let visibleCount = 0;
            const query = searchQuery.toLowerCase();
            
            // ใช้ classList อัปเดต UI ทันที ไม่แล็กแน่นอน
            organisms.forEach(org => {
                const card = document.getElementById(`card-${org.id}`);
                const matchQuery = org.name.toLowerCase().includes(query);
                const matchCat = activeCategory === 'all' || org.category === activeCategory;
                
                if (matchQuery && matchCat) {
                    card.classList.remove('hidden');
                    visibleCount++;
                } else {
                    card.classList.add('hidden');
                }
            });

            document.getElementById('emptySearch').classList.toggle('hidden', visibleCount > 0);
        }

        function updateSelectionUI() {
            // เคลียร์ UI เดิมทั้งหมดก่อน
            organisms.forEach(org => {
                const card = document.getElementById(`card-${org.id}`);
                const check = document.getElementById(`check-${org.id}`);
                card.classList.remove('border-cyan-500', 'ring-2', 'ring-cyan-500/50', 'scale-[0.98]');
                check.classList.remove('opacity-100', 'scale-100');
                check.classList.add('opacity-0', 'scale-50');
            });

            // ไฮไลต์ตัวที่ถูกเลือก
            [slot1, slot2].forEach(slot => {
                if (slot) {
                    const card = document.getElementById(`card-${slot.id}`);
                    const check = document.getElementById(`check-${slot.id}`);
                    card.classList.add('border-cyan-500', 'ring-2', 'ring-cyan-500/50', 'scale-[0.98]');
                    check.classList.remove('opacity-0', 'scale-50');
                    check.classList.add('opacity-100', 'scale-100');
                }
            });

            updateLabBoardUI();
        }

        function updateLabBoardUI() {
            const updateSlot = (slotData, slotNum) => {
                const container = document.getElementById(`slot${slotNum}-container`);
                const empty = document.getElementById(`slot${slotNum}-empty`);
                const content = document.getElementById(`slot${slotNum}-content`);
                const mediaBox = document.getElementById(`slot${slotNum}-media`);
                const name = document.getElementById(`slot${slotNum}-name`);

                if (slotData) {
                    empty.classList.add('hidden');
                    content.classList.remove('hidden');
                    name.textContent = slotData.name;
                    container.classList.add('border-cyan-500', 'slot-active');
                    container.classList.remove('border-slate-700', 'border-dashed');

                    // ดึงภาพจากคลัง (ตัวที่โชว์ผ่านแล้ว) มาใส่ในช่องจับคู่โดยตรง
                    mediaBox.innerHTML = '';
                    const invCard = document.getElementById(`card-${slotData.id}`);
                    if (invCard && invCard.firstElementChild) {
                        const clonedMedia = invCard.firstElementChild.cloneNode(true);
                        if (clonedMedia.tagName === 'IMG') {
                            clonedMedia.className = "w-full h-full object-cover transition-transform duration-700 group-hover:scale-110";
                        }
                        mediaBox.appendChild(clonedMedia);
                    }
                } else {
                    empty.classList.remove('hidden');
                    content.classList.add('hidden');
                    mediaBox.innerHTML = '';
                    container.classList.remove('border-cyan-500', 'slot-active');
                    container.classList.add('border-slate-700', 'border-dashed');
                }
            };

            updateSlot(slot1, 1);
            updateSlot(slot2, 2);

            const plus = document.getElementById('plus-icon');
            if (slot1 && slot2) {
                plus.classList.add('rotate-180', 'text-cyan-400', 'scale-125');
            } else {
                plus.classList.remove('rotate-180', 'text-cyan-400', 'scale-125');
            }

            document.getElementById('btnClear').classList.toggle('hidden', !(slot1 || slot2));
        }

        function triggerAnalysisAnimation() {
            const resultBox = document.getElementById('resultState');
            const waitingBox = document.getElementById('waitingState');
            const scanOverlay = document.getElementById('scanOverlay');
            
            // ซ่อนผลลัพธ์ โชว์สแกนเนอร์
            resultBox.classList.add('hidden', 'opacity-0');
            waitingBox.classList.add('hidden');
            scanOverlay.classList.remove('hidden');
            scanOverlay.classList.add('flex');
            
            // เล่นแอนิเมชัน 1.5 วินาที
            setTimeout(() => {
                scanOverlay.classList.add('hidden');
                scanOverlay.classList.remove('flex');
                showResultCard();
                isAnalyzing = false;
            }, 1500);
        }

        function showResultCard() {
            const container = document.getElementById('resultState');
            if (slot1 && slot2) {
                const matchInfo = getMatchResult(slot1, slot2);
                const typeInfo = relationshipTypes.find(t => t.id === matchInfo.type);
                const result = { ...matchInfo, ...typeInfo };
                
                container.innerHTML = `
                    <div class="w-full h-full ${result.bg} ${result.border} border-2 rounded-2xl p-4 sm:p-6 backdrop-blur-md shadow-xl flex flex-col items-center text-center animate-pop ${result.glow} hardware-accelerated">
                        <div class="flex items-center gap-2 sm:gap-3 mb-2 sm:mb-3">
                            <h3 class="text-xl sm:text-3xl font-black ${result.color} drop-shadow-md tracking-wide">
                                ${result.name}
                            </h3>
                            <span class="bg-black/40 px-3 py-1 sm:px-4 sm:py-1.5 rounded-full text-sm sm:text-lg font-mono font-bold tracking-widest border border-white/20 text-white shadow-inner">
                                ${result.symbols}
                            </span>
                        </div>
                        <p class="text-slate-200 text-xs sm:text-base mb-1 max-w-lg leading-relaxed opacity-90">
                            ${result.detail}
                        </p>
                    </div>
                `;
                container.classList.remove('hidden');
                // Use slight timeout to allow display:block to apply before opacity transition
                setTimeout(() => container.classList.remove('opacity-0'), 50);
            }
        }

        window.selectOrganism = function(orgId) {
            if (isAnalyzing) return; // ล็อกปุ่มตอน AI สแกน
            
            const org = organisms.find(o => o.id === orgId);
            
            // กรณีเลือกตัวเดิมซ้ำ ให้เคลียร์ตัวนั้นทิ้ง
            if (slot1 && slot1.id === orgId) {
                slot1 = null;
            } else if (slot2 && slot2.id === orgId) {
                slot2 = null;
            } else if (!slot1) {
                slot1 = org;
            } else if (!slot2) {
                slot2 = org;
            } else {
                slot2 = org; // ถ้าเต็มให้ทับช่อง 2
            }

            updateSelectionUI();

            // วิเคราะห์และสแกน
            if (slot1 && slot2) {
                isAnalyzing = true;
                triggerAnalysisAnimation();
            } else {
                document.getElementById('resultState').classList.add('hidden', 'opacity-0');
                document.getElementById('waitingState').classList.remove('hidden');
            }
        };

        window.clearSlot = function(slotNum) {
            if (isAnalyzing) return;
            if (slotNum === 1) slot1 = null;
            if (slotNum === 2) slot2 = null;
            updateSelectionUI();
            document.getElementById('resultState').classList.add('hidden', 'opacity-0');
            document.getElementById('waitingState').classList.remove('hidden');
        };

        window.clearBoard = function() {
            if (isAnalyzing) return;
            slot1 = null;
            slot2 = null;
            updateSelectionUI();
            document.getElementById('resultState').classList.add('hidden', 'opacity-0');
            document.getElementById('waitingState').classList.remove('hidden');
        };

        window.setCategory = function(catId) {
            activeCategory = catId;
            // Update filter buttons style
            categories.forEach(cat => {
                const btn = document.getElementById(`btn-cat-${cat.id}`);
                if (cat.id === catId) {
                    btn.className = `whitespace-nowrap flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[10px] sm:text-xs font-medium transition-all bg-cyan-600 text-white shadow-md transform scale-105`;
                } else {
                    btn.className = `whitespace-nowrap flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[10px] sm:text-xs font-medium transition-all bg-slate-800/80 text-slate-400 hover:bg-slate-700 hover:text-white`;
                }
            });
            filterInventory();
        };

        window.handleSearch = function() {
            searchQuery = document.getElementById('searchInput').value;
            filterInventory();
        };

        window.toggleModal = function(show) {
            const modal = document.getElementById('infoModal');
            const box = document.getElementById('modalBox');
            if (show) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                // Trigger transition
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    box.classList.remove('scale-95');
                    box.classList.add('scale-100');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                box.classList.remove('scale-100');
                box.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 300);
            }
        };

        // เริ่มต้นการทำงาน (Initial Render)
        window.onload = function() {
            initInventory();
            lucide.createIcons();
        };
    </script>
</body>
</html>
